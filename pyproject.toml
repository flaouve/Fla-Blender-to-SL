[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fla-blender-to-sl"
version = "0.2.0"
description = "Hybrid Blender-to-SCP:SL (Fla-SL-CustomObjects / FlaProjectMER) schematic converter"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "Pillow>=10.0",
]

[project.scripts]
fla-blender-to-sl = "fla_blender_to_sl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fla_blender_to_sl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
