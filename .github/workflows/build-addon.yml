name: Build Blender Addon

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Build addon zip
        run: python scripts/build_addon_zip.py

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: fla_blender_to_sl_addon
          path: dist/fla_blender_to_sl_addon.zip

      - name: Attach addon zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fla_blender_to_sl_addon.zip
